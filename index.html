<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="My Note - Bloc-notes moderne, rapide, 100% hors ligne">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Note">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="mask-icon" href="./assets/favicon.svg" color="#E11D2E">
  <title data-i18n="appName">My Note</title>
  
  <!-- Script anti-flash thème (DOIT être avant CSS) -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'auto';
      var root = document.documentElement;
      if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', theme);
    })();
  </script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/themes.css">
  <link rel="stylesheet" href="./css/print.css">
  
  <!-- Libs tierces (locales) -->
  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/dompurify.min.js"></script>
</head>
<body>
  <div class="app" id="app" role="application">
    <!-- Le contenu est injecté par main.js -->
  </div>
  
  <!-- Point d'entrée JS -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
